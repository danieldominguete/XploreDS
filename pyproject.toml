[project]
name = "xploreds"
version = "0.1.0"
description = "Library and cookbook codes for Data Science Projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xploreds"]

[dependency-groups]
dev = [
    "commitizen>=4.6",
    "pre-commit>=4.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
annotated_tag = true
version_files = [
    "xploreds/__init__.py:__version__",
]
