[project]
name = "xploreds"
version = "0.1.0"
description = "Library and cookbook codes for Data Science Projects"
authors = [
    { name = "Daniel Dominguete", email = "daniel.dominguete@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "openpyxl>=3.1",
    "pandas>=3.0.6",
    "psutil>=6.0",
    "pyarrow>=18.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "commitizen>=4.6",
    "ipykernel>=6.29",
    "nbstripout>=0.9.1",
    "pre-commit>=4.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xploreds"]

[tool.hatch.build.targets.sdist]
include = ["src/xploreds"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
annotated_tag = true
version_files = [
    "src/xploreds/__init__.py:__version__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
